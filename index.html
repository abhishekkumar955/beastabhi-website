<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131a"><meta name="description" content="Chat Gupta — AI chat powered by GPT"><title>Chat Gupta — AI सहायक</title>
<style>
:root{color-scheme:dark;--bg:#212121;--side:#171717;--panel:#2f2f2f;--line:#3d3d3d;--text:#ececec;--muted:#a6a6a6;--green:#10a37f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.app{height:100dvh;display:grid;grid-template-columns:260px 1fr}.sidebar{background:var(--side);padding:14px;display:flex;flex-direction:column;border-right:1px solid #252525}.brand{font-weight:750;font-size:19px;padding:8px 10px 24px}.brand b{color:#8ce4c5}.new{width:100%;background:transparent;color:var(--text);border:1px solid #484848;border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer}.new:hover{background:#242424}.side-note{margin-top:auto;color:#929292;font-size:12px;padding:12px 8px}.main{min-width:0;display:flex;flex-direction:column}.top{height:58px;border-bottom:1px solid #303030;display:flex;align-items:center;padding:0 22px;font-weight:650}.status{font-size:12px;color:#93d9bd;margin-left:auto}.feed{flex:1;overflow:auto;padding:28px 18px}.welcome{height:100%;display:grid;place-content:center;text-align:center;padding:20px}.welcome h1{font-size:clamp(25px,4vw,34px);line-height:1.2;margin:0 0 9px}.welcome p{color:var(--muted);margin:0}.messages{max-width:780px;margin:auto}.msg{display:flex;gap:14px;padding:18px 0}.avatar{width:29px;height:29px;flex:0 0 29px;border-radius:50%;display:grid;place-items:center;background:#444;font-size:13px;font-weight:700}.msg.assistant .avatar{background:#135c49;color:#b9f4df}.text{white-space:pre-wrap;overflow-wrap:anywhere;padding-top:2px}.composer-wrap{padding:10px 18px 20px}.composer{max-width:780px;margin:auto;border:1px solid #555;background:#2f2f2f;border-radius:22px;padding:10px;display:flex;align-items:end;gap:8px;box-shadow:0 6px 24px #0002}.composer:focus-within{border-color:#777}.composer textarea{resize:none;max-height:190px;min-height:28px;flex:1;background:transparent;color:var(--text);border:0;outline:0;font:inherit;padding:5px 8px}.send{height:36px;width:38px;flex:0 0 38px;border:0;border-radius:50%;background:#f4f4f4;color:#171717;font-size:20px;font-weight:800;cursor:pointer}.send:disabled{opacity:.5;cursor:wait}.disclaimer{text-align:center;color:#8c8c8c;font-size:11px;margin:9px auto 0;max-width:780px}.mobile-new{display:none;background:transparent;border:0;color:white;font-size:20px;margin-right:8px}.error{color:#ffaaaa}.typing{color:var(--muted);font-style:italic}.suggestions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:22px}.suggestions button{color:#ddd;background:#2b2b2b;border:1px solid #444;border-radius:14px;padding:9px 13px;cursor:pointer}.suggestions button:hover{background:#383838}
@media(max-width:680px){.app{grid-template-columns:1fr}.sidebar{display:none}.top{padding:0 14px}.mobile-new{display:block}.feed{padding:16px 14px}.composer-wrap{padding:8px 12px 13px}.welcome h1{font-size:27px}}
</style></head>
<body><div class="app"><aside class="sidebar"><div class="brand">✳ Chat <b>Gupta</b></div><button class="new" id="newChat">＋ नई चैट</button><div class="side-note">GPT से जुड़ा AI सहायक। आपकी API key सर्वर पर सुरक्षित रहती है।</div></aside><main class="main"><header class="top"><button class="mobile-new" id="mobileNew" aria-label="नई चैट">＋</button>Chat Gupta <span class="status">● GPT कनेक्शन</span></header><section class="feed" id="feed"><div class="welcome" id="welcome"><div><h1>आज मैं आपकी क्या मदद करूँ?</h1><p>कोई सवाल लिखें—मैं GPT से जवाब लेने की कोशिश करूँगा।</p><div class="suggestions"><button>एक छोटी कहानी सुनाओ</button><button>वेबसाइट बनाने में मदद करो</button><button>इसका जवाब हिंदी में दो</button></div></div></div><div class="messages" id="messages" aria-live="polite"></div></section><div class="composer-wrap"><form class="composer" id="form"><textarea id="input" rows="1" placeholder="Chat Gupta से कुछ भी पूछें…" aria-label="संदेश लिखें"></textarea><button class="send" id="send" aria-label="भेजें">↑</button></form><div class="disclaimer">AI गलतियाँ कर सकता है। संवेदनशील निजी जानकारी साझा न करें।</div></div></main></div>
<script>
const form=document.querySelector('#form'),input=document.querySelector('#input'),messages=document.querySelector('#messages'),welcome=document.querySelector('#welcome'),feed=document.querySelector('#feed');let history=[];
function addMessage(role,text,extra=''){const row=document.createElement('div');row.className='msg '+role;const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=role==='user'?'तू':'✳';const body=document.createElement('div');body.className='text '+extra;body.textContent=text;row.append(avatar,body);messages.append(row);feed.scrollTop=feed.scrollHeight;return body}
async function sendMessage(text){if(!text.trim())return;welcome.hidden=true;addMessage('user',text);history.push({role:'user',content:text});input.value='';input.style.height='auto';input.disabled=true;document.querySelector('#send').disabled=true;const pending=addMessage('assistant','जवाब तैयार हो रहा है…','typing');try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'जवाब नहीं मिल पाया।');pending.textContent=data.reply;pending.classList.remove('typing');history.push({role:'assistant',content:data.reply});}catch(error){pending.textContent=error.message||'कनेक्शन में समस्या आई।';pending.classList.remove('typing');pending.classList.add('error');history.pop();}finally{input.disabled=false;document.querySelector('#send').disabled=false;input.focus();feed.scrollTop=feed.scrollHeight}}
form.addEventListener('submit',e=>{e.preventDefault();sendMessage(input.value)});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,190)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});function reset(){history=[];messages.replaceChildren();welcome.hidden=false;input.value='';input.focus()}document.querySelector('#newChat').addEventListener('click',reset);document.querySelector('#mobileNew').addEventListener('click',reset);document.querySelectorAll('.suggestions button').forEach(b=>b.addEventListener('click',()=>sendMessage(b.textContent)));
</script></body></html>
