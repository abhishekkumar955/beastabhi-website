<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131a"><title>BeastAbhi Chat</title>
<style>
:root{color-scheme:dark;--bg:#10131a;--panel:#171a22;--line:#2b303a;--text:#f2f4f8;--muted:#a3a9b5;--green:#42c98b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.app{height:100dvh;display:grid;grid-template-columns:260px 1fr}.side{background:#0b0d12;border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column}.brand{font-weight:800;font-size:19px;padding:8px 10px 24px}.brand b{color:var(--green)}.new{background:transparent;color:var(--text);border:1px solid #444a55;border-radius:10px;padding:11px;text-align:left;cursor:pointer}.hint{margin-top:auto;color:var(--muted);font-size:12px;padding:10px}.main{min-width:0;display:flex;flex-direction:column}.top{height:60px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;font-weight:650}.feed{flex:1;overflow:auto;padding:28px 18px}.welcome{height:100%;display:grid;place-content:center;text-align:center;padding:20px}.welcome h1{font-size:30px;margin:0 0 8px}.welcome p{color:var(--muted);margin:0}.messages{max-width:760px;margin:auto}.msg{display:flex;gap:14px;padding:19px 0;border-bottom:1px solid rgba(255,255,255,.04)}.avatar{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:grid;place-items:center;background:#262b35;font-size:14px}.msg.assistant .avatar{background:#173a2d;color:#8ee4b5}.text{white-space:pre-wrap;overflow-wrap:anywhere;padding-top:2px}.composer-wrap{padding:10px 18px 22px}.composer{max-width:760px;margin:auto;border:1px solid #3b414d;background:#1a1e27;border-radius:18px;padding:10px;display:flex;align-items:end;gap:8px;box-shadow:0 6px 24px #0003}.composer textarea{resize:none;max-height:180px;min-height:28px;flex:1;background:transparent;color:var(--text);border:0;outline:0;font:inherit;padding:5px 8px}.send{height:36px;width:38px;border:0;border-radius:11px;background:var(--green);color:#06170f;font-size:19px;font-weight:800;cursor:pointer}.send:disabled{opacity:.5}.disclaimer{text-align:center;color:#858b97;font-size:11px;margin:9px auto 0;max-width:760px}.mobile-menu{display:none}
@media(max-width:680px){.app{grid-template-columns:1fr}.side{display:none}.top{padding:0 15px}.mobile-menu{display:inline-block;margin-right:10px;background:none;border:0;color:white;font-size:20px}.feed{padding:16px 14px}.composer-wrap{padding:8px 12px 14px}.welcome h1{font-size:26px}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand">⚡ Beast<b>Abhi</b> Chat</div><button class="new" id="newChat">＋ नई चैट</button><div class="hint">यह चैट UI डेमो है। असली AI जवाब के लिए सुरक्षित सर्वर/API जोड़ना होगा।</div></aside><main class="main"><header class="top"><button class="mobile-menu" id="mobileNew" aria-label="नई चैट">＋</button>BeastAbhi Chat</header><section class="feed" id="feed"><div class="welcome" id="welcome"><div><h1>आज मैं आपकी क्या मदद करूँ?</h1><p>अपना संदेश नीचे लिखकर शुरू करें।</p></div></div><div class="messages" id="messages"></div></section><div class="composer-wrap"><form class="composer" id="form"><textarea id="input" rows="1" placeholder="BeastAbhi Chat से कुछ भी पूछें…" aria-label="संदेश लिखें"></textarea><button class="send" id="send" aria-label="भेजें">↑</button></form><div class="disclaimer">डेमो संस्करण—यह अभी वास्तविक AI सेवा से कनेक्ट नहीं है।</div></div></main></div>
<script>
const form=document.querySelector('#form'),input=document.querySelector('#input'),messages=document.querySelector('#messages'),welcome=document.querySelector('#welcome'),feed=document.querySelector('#feed');
function addMessage(role,text){const row=document.createElement('div');row.className='msg '+role;const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=role==='user'?'आप':'⚡';const body=document.createElement('div');body.className='text';body.textContent=text;row.append(avatar,body);messages.append(row);feed.scrollTop=feed.scrollHeight}
function demoReply(text){const t=text.toLowerCase();if(t.includes('beast')||t.includes('वीर')||t.includes('हीरो'))return 'BeastAbhi हमारी कहानी का साहसी सुपरहीरो है। वह अपनी नीली बिजली और वज्र-गदा से लोगों की रक्षा करता है।';if(t.includes('नमस्ते')||t.includes('हेलो')||t.includes('hello'))return 'नमस्ते! मैं BeastAbhi Chat का डेमो सहायक हूँ। बताइए, मैं किस चीज़ में मदद करूँ?';if(t.includes('वेबसाइट')||t.includes('website'))return 'यह BeastAbhi Chat वेबसाइट का शुरुआती डेमो है। असली AI जवाबों के लिए सुरक्षित सर्वर और AI API कनेक्शन जोड़ना बाकी है।';return 'आपका संदेश मिल गया! अभी यह वेबसाइट इंटरफ़ेस डेमो मोड में है, इसलिए मैं वास्तविक AI जवाब नहीं दे सकता। असली चैट के लिए सुरक्षित AI सेवा कनेक्ट करनी होगी।'}
form.addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text)return;welcome.hidden=true;addMessage('user',text);input.value='';input.style.height='auto';const send=document.querySelector('#send');send.disabled=true;setTimeout(()=>{addMessage('assistant',demoReply(text));send.disabled=false;input.focus()},450)});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,180)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
function reset(){messages.replaceChildren();welcome.hidden=false;input.value='';input.focus()}document.querySelector('#newChat').addEventListener('click',reset);document.querySelector('#mobileNew').addEventListener('click',reset);
</script></body></html>
